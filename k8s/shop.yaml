# Local minikube demo: one pod, persistent SQLite volume.
apiVersion: v1
kind: Namespace
metadata:
  name: deep-utsav
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: shop-data
  namespace: deep-utsav
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: deep-utsav
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: shop
          image: deep-utsav:1.0
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_PATH
              value: /app/data/orders.db
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /app/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 20
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: shop-data
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: deep-utsav
spec:
  selector:
    app: shop
  ports:
    - port: 80
      targetPort: 8000
  type: ClusterIP
